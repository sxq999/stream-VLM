<g id="header" data-pptx-bounds="64 18 1152 148"><text x="64" y="42" font-size="18" fill="#087F8C">05 执行与测量</text><text x="64" y="102" font-size="42" fill="#16324F" font-weight="bold">GPU 诊断与普通计时分开运行</text><text x="64" y="150" font-size="24" fill="#566879">先确认执行路径，再用匹配的非 profiling 运行比较性能</text></g>
<g id="native-trace" data-pptx-bounds="64 205 544 350" fill="#203448"><text x="64" y="245" font-size="30" fill="#087F8C" font-weight="bold">Native trace</text><text x="64" y="310" font-size="26">请求范围与 CPU / CUDA 活动</text><text x="64" y="370" font-size="26">vision_encoder 模块范围</text><text x="64" y="430" font-size="26">首次语言 forward 标为 prefill</text><text x="64" y="490" font-size="26">随后语言 forward 标为 decode</text></g>
<g id="vllm-trace" data-pptx-bounds="664 205 552 350" fill="#203448"><text x="664" y="245" font-size="30" fill="#16324F" font-weight="bold">vLLM 引擎 trace</text><text x="664" y="310" font-size="26">调用真实服务端 profiler 接口</text><text x="664" y="370" font-size="26">已确认 kernel 与 memcpy 事件</text><text x="664" y="430" font-size="26">采集引擎工作负载区间</text><text x="664" y="490" font-size="26">逐请求 kernel 归属尚未建立</text></g>
<g id="scope" data-pptx-bounds="64 575 1152 78" fill="#B76B23" font-size="24"><text x="64" y="605">CPU range 不是 GPU 独占时长；客户端重叠不证明 kernel 并行</text><text x="64" y="642">nvidia-smi 约每两秒设备采样，可能遗漏短暂峰值和混入其他进程</text></g>
