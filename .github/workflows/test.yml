name: harness-tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m stream_pipeline validate --suite tests
      - run: python -m stream_pipeline run --config configs/mock.json --out runs/ci-smoke
      - run: python -m stream_pipeline suite --suite configs/suite-smoke.json --out runs/ci-suite
