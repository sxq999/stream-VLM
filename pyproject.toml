[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-vlm-pipeline"
version = "0.1.0"
description = "Causal streaming VLM deployment and measurement harness"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
stream-pipeline = "stream_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
